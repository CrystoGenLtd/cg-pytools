[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cg-pytools"
version = "0.2.1"
description = "Crystal-shape / coarse-grained morphology analysis library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "COPYING.LESSER" }
authors = [
    { name = "Alvin Jenner W" },
    { name = "Adam R. Hill" },
]
keywords = ["crystallography", "morphology", "wulff", "crystal-shape"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
]
dependencies = [
    "numpy>=2.3.4",
    "scipy>=1.16.2",
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "trimesh>=4.6.6",
    "chmpy>=1.1.6",
    "plotly>=5.24.0",
    "mplcursors>=0.6",
    "natsort>=8.4.0",
    "tqdm>=4.67.0",
]

[project.scripts]
cg-screen = "cgpytools.analysis.screen:main"
cg-surfaces = "cgpytools.analysis.surfaces:main"

[project.urls]
Homepage = "https://github.com/CrystoGenLtd/cg-pytools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# G: lazy % formatting in logging calls, BLE: no bare `except Exception`
extend-select = ["G", "BLE"]
